<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Exchange</title>
    <meta name="description" content="A comprehensive platform for free skill swaps and paid expert lessons, featuring deterministic smart matching, interactive appointments, mock payments, messaging, and moderation." />
    <meta property="og:title" content="Skill Exchange" />
    <meta property="og:description" content="A comprehensive platform for free skill swaps and paid expert lessons, featuring deterministic smart matching, interactive appointments, mock payments, messaging, and moderation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var qTheme = params.get('theme');
          var saved = qTheme === 'dark' || qTheme === 'light' ? qTheme : localStorage.getItem('SKILL_EXCHANGE_THEME_V1');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
